[project]
name = "bfg"
version = "0.1.0"
description = "BFG (BiologicalFiGures): orchestrating pre-trained AI models to annotate biomedical preprint figures."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "huggingface-hub>=0.24",
    "python-dotenv>=1.0",
    # Pinned below 5 because transformers 5.x dropped the slow tokenizer
    # fallback that TrOCRProcessor relies on for microsoft/trocr-base-printed.
    "transformers>=4.44,<5",
    "torch>=2.2",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "httpx>=0.27",
    "certifi>=2024.2.2",
    "ipykernel>=7.3.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "matplotlib>=3.11.1",
    "pandas-stubs~=3.0.5",
    "jiwer>=4.0.0",
    "spacy>=3.8",
    "scispacy>=0.6.2",
    "tabulate>=0.10.0",
    "sentencepiece>=0.2.2",
    "ipywidgets>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
bfg = "bfg.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bfg"]

[tool.hatch.build.targets.wheel.sources]
"src/bfg" = "bfg"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
